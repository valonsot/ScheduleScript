name: Ejecutar Bot Abonoteatro

on:
   
# schedule:
#    - cron: '*/20 * * * *'  # Se ejecuta cada 10 minutos
  workflow_dispatch:       # Permite darle al botón "Run" a mano (alineado con schedule)

concurrency:
  group: bot-abonoteatro
  cancel-in-progress: false 
   
jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write # PERMISO CRÍTICO para poder modificar el archivo CSV en el repo

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      #- name: Instalar Módulo Selenium
      #  shell: pwsh
      #  run: |
      #    Install-Module -Name Selenium -Force -Scope CurrentUser

      - name: Ejecutar Script de Tickets
        shell: pwsh
        env:
         ABONO_USER: ${{ secrets.ABONO_USER }}
         ABONO_PASS: ${{ secrets.ABONO_PASS }}
         TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         URL_LOGIN: ${{ secrets.URL_LOGIN }}
         URL_BASE: ${{ secrets.URL_BASE }}
        run: |
          ./ultimo_github.ps1
          
      - name: Debug - localizar CSV
        shell: pwsh
        run: |
          Write-Host "Directorio actual: $(Get-Location)"
          Write-Host "PTH_EVT: $env:PTH_EVT"
          Write-Host "Buscando eventos.csv en el repo..."
          Get-ChildItem -Recurse -Filter "eventos.csv" -ErrorAction SilentlyContinue
      
      - name: Commit CSV changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eventos.csv

          $status = git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
              git commit -m "Actualizar eventos.csv [skip ci]"
              git push
          } else {
              Write-Host "No hay cambios en eventos.csv, no se hace commit."
          }
         
           
     
